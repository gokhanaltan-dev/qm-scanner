name: Daily scan

on:
  schedule:
    # 22:30 UTC, Monday to Friday: after the US close in both summer and winter time
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}
  # Also rerun when the settings or the code change, so an edit to config.yaml shows up at once
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "requirements.txt"
      - "scanner/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-page
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the scan
        run: python -m scanner.build

      - name: Save the setup log
        run: |
          git config user.name "qm-scanner-bot"
          git config user.email "qm-scanner-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Scan $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
