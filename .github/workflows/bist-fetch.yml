name: BIST data fetch
on:
  workflow_dispatch: {}
  push:
    branches: [bist-research]
    paths: ["bist/fetch.py", "bist/fetch_request.txt", ".github/workflows/bist-fetch.yml"]
permissions:
  contents: write
concurrency:
  group: bist-fetch
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -q -r requirements.txt
      - run: python -m bist.fetch --out data_out --start 2014-01-01
      - name: Publish to the bist-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data_out
          git init -q -b bist-data
          git config user.name "bist-bot"
          git config user.email "bist-bot@users.noreply.github.com"
          git add . && git commit -q -m "BIST data $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bist-data
