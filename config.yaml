# Settings for the daily scan. Edit this file, commit, and the next run uses it.

account:
  size_usd: 20000          # account value in US dollars (convert from GBP)
  risk_per_trade_pct: 0.5  # share of the account lost if a full-size trade hits its stop
  max_position_pct: 20     # hard cap on any single position, as % of the account

# Tickers you have decided not to trade again (repeat losers). They are never shown as setups.
no_trade: []

universe:
  min_price: 5             # dollars
  min_dollar_volume: 10000000  # 20-day average daily dollar volume, in dollars
  min_adr_pct: 4.0         # 20-day average daily range, %
  min_rs_rank: 93          # top 7% of gainers over 1, 3 or 6 months (any one of the three)

breakout:
  min_leg_gain_pct: 30     # size of the run-up before the base
  min_base_days: 4
  max_base_days: 40
  max_retrace: 0.5         # base may give back at most half of the run-up

episodic_pivot:
  min_gap_pct: 8
  min_volume_multiple: 2.5 # gap-day volume vs 50-day average
  lookback_days: 4         # also show gaps from the last few sessions that are still holding

report:
  max_ready: 15
  max_building: 15
  max_episodic: 10
  min_score: 55
